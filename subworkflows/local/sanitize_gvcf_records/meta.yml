# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/subworkflows/yaml-schema.json
name: "sanitize_gvcf_records"
description: |
  Drop malformed records from each input GVCF, then left-normalize the remainder against the
  reference. BCFTOOLS_FILTER discards records missing the required <NON_REF> allele (e.g. the
  DRAGEN 4.4.7 defect that otherwise makes GATK4_GENOTYPEGVCFS fail -- BIOINFO-222);
  BCFTOOLS_NORM then left-aligns indels and removes duplicate-position records.
keywords:
  - vcf
  - gvcf
  - bcftools
  - filter
  - normalize
components:
  - bcftools/filter
  - bcftools/norm
input:
  - ch_input:
      description: |
        Per-sample GVCF with metadata
        Structure: [ val(meta), path(vcf) ]
  - ch_fasta:
      description: |
        Reference fasta tuple, matching nf-core/bcftools/norm input shape
        Structure: [ val(meta2), path(fasta) ]
output:
  - vcf_tbi:
      description: |
        Sanitized, left-normalized VCF and its tabix index
        Structure: [ val(meta), path(vcf), path(tbi) ]
  - versions:
      description: |
        Aggregated software versions from the underlying processes
        Structure: [ path(versions.yml) ]
authors:
  - "@FelixAntoineLeSieur"
  - "@dmorais"
  - "@LysianeBouchard"
  - "@DamienGnst"
  - "@georgette-femerling"
maintainers:
